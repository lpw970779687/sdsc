<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>素材详情 - 沙雕动画素材库</title>
  <meta name="description" content="素材详情页" />
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    .detail-shell {
      max-width: 1180px;
      margin: 36px auto 72px;
      padding: 0 24px;
    }
    .detail-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      background: #fff;
      border: 3px solid #111;
      border-radius: 28px;
      box-shadow: 10px 10px 0 #111;
      padding: 24px;
    }
    .detail-image {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      background: #fff3b7;
      border-radius: 20px;
      padding: 16px;
    }
    .detail-meta { padding-top: 8px; }
    .detail-title {
      margin: 10px 0 8px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.1;
    }
    .detail-desc { color: var(--muted); line-height: 1.8; }
    .detail-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
    .detail-empty,
    .empty-state {
      margin: 80px auto;
    }
    @media (max-width: 900px) {
      .detail-card { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .detail-shell { padding: 0 12px; margin-top: 20px; }
      .detail-card { padding: 16px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="logo" href="./index.html">沙雕素材库</a>
      <div class="nav-links">
        <a href="./index.html#materials">返回素材列表</a>
      </div>
    </nav>
  </header>

  <main class="detail-shell">
    <div id="detailMount"></div>
  </main>

  <script src="./js/materials-data.js"></script>
  <script src="./js/detail.js"></script>
</body>
</html>
